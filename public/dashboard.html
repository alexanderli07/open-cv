<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Vision Control Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container-fluid p-4">

<h1 class="mb-4">AI FACE RECOGNITION CONTROL PANEL</h1>

<div class="row g-4 mb-4">

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">SYSTEM STATUS</div>
<div class="metric">
<span class="status-dot"></span>
LIVE
</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">TOTAL DETECTIONS</div>
<div class="metric" id="totalDetections">0</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">FPS</div>
<div class="metric" id="fpsMetric">--</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">LATENCY</div>
<div class="metric" id="latencyMetric">--</div>
</div>
</div>

</div>

<div class="row g-4">

<div class="col-lg-6">

<div class="card p-3">

<h5>Camera Feed</h5>

<div class="camera-box">
Camera Stream Placeholder
</div>

</div>

<div class="card p-3 mt-4">

<h5>Recent Detections</h5>

<div id="eventFeed"></div>

</div>

</div>

<div class="col-lg-6">

<div class="card p-3">

<h5>Detection Frequency</h5>

<canvas id="frequencyChart"></canvas>

</div>

<div class="card p-3 mt-4">

<h5>Top Subjects</h5>

<table class="table table-dark table-sm">

<thead>
<tr>
<th>Name</th>
<th class="text-end">Count</th>
</tr>
</thead>

<tbody id="topSubjects"></tbody>

</table>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-12">

<div class="card p-3">

<h5>Detection Timeline</h5>

<canvas id="timelineChart"></canvas>

</div>

</div>

</div>

</div>

<script src="http://localhost:3000/socket.io/socket.io.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
