<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Vision Control Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
background:#0b0f19;
color:white;
font-family:'Inter',sans-serif;
}

.card{
background:#151a27;
border:none;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
font-weight:700;
letter-spacing:1px;
}

.metric{
font-size:28px;
font-weight:700;
}

.metric-label{
font-size:12px;
color:#8b93a6;
text-transform:uppercase;
}

.status-dot{
width:10px;
height:10px;
background:#00ff9c;
border-radius:50%;
display:inline-block;
margin-right:6px;
box-shadow:0 0 10px #00ff9c;
}

.feed-item{
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.subject{
color:#00d4ff;
font-weight:600;
}

.confidence{
color:#ffd54a;
}

.camera-box{
background:#000;
height:260px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
color:#666;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<h1 class="mb-4">AI FACE RECOGNITION CONTROL PANEL</h1>

<div class="row g-4 mb-4">

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">SYSTEM STATUS</div>
<div class="metric">
<span class="status-dot"></span>
LIVE
</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">TOTAL DETECTIONS</div>
<div class="metric" id="totalDetections">0</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">FPS</div>
<div class="metric" id="fpsMetric">--</div>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<div class="metric-label">LATENCY</div>
<div class="metric" id="latencyMetric">--</div>
</div>
</div>

</div>

<div class="row g-4">

<div class="col-lg-6">

<div class="card p-3">

<h5>Camera Feed</h5>

<div class="camera-box">
Camera Stream Placeholder
</div>

</div>

<div class="card p-3 mt-4">

<h5>Recent Detections</h5>

<div id="eventFeed"></div>

</div>

</div>

<div class="col-lg-6">

<div class="card p-3">

<h5>Detection Frequency</h5>

<canvas id="frequencyChart"></canvas>

</div>

<div class="card p-3 mt-4">

<h5>Top Subjects</h5>

<table class="table table-dark table-sm">

<thead>
<tr>
<th>Name</th>
<th class="text-end">Count</th>
</tr>
</thead>

<tbody id="topSubjects"></tbody>

</table>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-12">

<div class="card p-3">

<h5>Detection Timeline</h5>

<canvas id="timelineChart"></canvas>

</div>

</div>

</div>

</div>

<script src="http://localhost:3000/socket.io/socket.io.js"></script>

<script>

const socket = io("http://localhost:3000")

const feed = document.getElementById("eventFeed")
const topSubjects = document.getElementById("topSubjects")
const totalMetric = document.getElementById("totalDetections")

let counts = {}
let timeline = []

const freqChart = new Chart(
document.getElementById("frequencyChart"),
{
type:"bar",
data:{
labels:[],
datasets:[{
label:"Detections",
data:[]
}]
},
options:{
plugins:{legend:{display:false}},
scales:{y:{beginAtZero:true}}
}
}
)

const timelineChart = new Chart(
document.getElementById("timelineChart"),
{
type:"line",
data:{
labels:[],
datasets:[{
label:"Events",
data:[]
}]
}
}
)

socket.on("face_event",(data)=>{

const {subject,confidence,total} = data

counts[subject] = total

let totalDetections = Object.values(counts).reduce((a,b)=>a+b,0)

totalMetric.innerText = totalDetections

updateSubjects()

addFeed(subject,confidence)

updateCharts(subject,total)

})

function updateSubjects(){

topSubjects.innerHTML=""

Object.entries(counts)
.sort((a,b)=>b[1]-a[1])
.slice(0,5)
.forEach(([name,count])=>{

topSubjects.innerHTML+=`

<tr>
<td>${name}</td>
<td class="text-end">${count}</td>
</tr>

`

})

}

function addFeed(name,confidence){

const el=document.createElement("div")

el.className="feed-item"

el.innerHTML=`
<span class="subject">${name}</span>
<span class="confidence">(${confidence.toFixed(2)})</span>
<span class="text-muted float-end">${new Date().toLocaleTimeString()}</span>
`

feed.prepend(el)

if(feed.children.length>10){
feed.removeChild(feed.lastChild)
}

}

function updateCharts(name,count){

freqChart.data.labels = Object.keys(counts)
freqChart.data.datasets[0].data = Object.values(counts)
freqChart.update()

timeline.push({
time:new Date().toLocaleTimeString(),
count:Object.values(counts).reduce((a,b)=>a+b,0)
})

if(timeline.length>20) timeline.shift()

timelineChart.data.labels = timeline.map(t=>t.time)
timelineChart.data.datasets[0].data = timeline.map(t=>t.count)
timelineChart.update()

}

</script>

</body>
</html>
