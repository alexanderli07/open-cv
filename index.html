<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Recognition | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="glitch-text">Face Recognition</h1>
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-label">LIVE SYSTEM MONITOR</span>
        </div>
    </div>
    
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="dashboard-card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Subject Identity</th>
                            <th class="text-end">Frequency</th>
                        </tr>
                    </thead>
                    <tbody id="tracker-table">
                        <tr>
                            <td colspan="2" class="text-center py-5 empty-state">
                                <div class="spinner-border spinner-border-sm text-info me-2"></div>
                                Awaiting incoming stream...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="footer-info mt-4">
                Connected to Node.js Gateway: <span class="text-cyan">localhost:3000</span>
            </div>
        </div>
    </div>
</div>

<script src="http://localhost:3000/socket.io/socket.io.js"></script>
<script>
    const socket = io('http://localhost:3000');
    const tableBody = document.getElementById('tracker-table');

    socket.on('dashboard_update', (data) => {
        tableBody.innerHTML = '';
        const entries = Object.entries(data);
        
        if (entries.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2" class="text-center py-5 text-muted">No detections recorded.</td></tr>';
            return;
        }

        for (const [name, count] of entries) {
            tableBody.innerHTML += `
                <tr>
                    <td><span class="subject-badge">${name}</span></td>
                    <td class="text-end">
                        <span class="count-text">${count}</span>
                        <span class="unit-text">hits</span>
                    </td>
                </tr>`;
        }
    });
</script>
</body>
</html>
