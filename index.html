<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h1 class="mb-4 text-center text-info">Face Recognition Dashboard</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bg-secondary text-white">
                    <div class="card-body">
                        <table class="table table-dark table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Subject Name</th>
                                    <th>Times Spotted</th>
                                </tr>
                            </thead>
                            <tbody id="tracker-table">
                                <tr>
                                    <td colspan="2" class="text-center">Waiting for camera data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script>
        // Connect to the Node.js server
        const socket = io('http://localhost:3000');
        const tableBody = document.getElementById('tracker-table');

        // Listen for updates from the server
        socket.on('dashboard_update', (data) => {
            tableBody.innerHTML = ''; // Clear current table
            
            // Rebuild the table with the new counts
            for (const [name, count] of Object.entries(data)) {
                const row = `<tr>
                                <td><span class="badge bg-primary fs-6">${name}</span></td>
                                <td class="fs-5 fw-bold text-warning">${count}</td>
                             </tr>`;
                tableBody.innerHTML += row;
            }
        });
    </script>
</body>
</html>
